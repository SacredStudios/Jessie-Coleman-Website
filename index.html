<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Jessie Coleman | Interactive Portfolio</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navbar-area-height: 110px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #9cf2ff 0%,
                    #d5f7ff 45%,
                    #eee1ff 100%
                );
        }

        body {
            position: relative;
        }

        body::before {
            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            top: -250px;
            left: -180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(67, 217, 255, 0.45),
                    transparent 70%
                );

            pointer-events: none;

            z-index: 1;

            animation:
                glowOne
                9s ease-in-out infinite alternate;
        }

        body::after {
            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            right: -200px;
            bottom: -220px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(189, 124, 255, 0.3),
                    transparent 70%
                );

            pointer-events: none;

            z-index: 1;

            animation:
                glowTwo
                11s ease-in-out infinite alternate;
        }

        @keyframes glowOne {
            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(100px, 60px)
                    scale(1.2);
            }
        }

        @keyframes glowTwo {
            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(-100px, -60px)
                    scale(1.15);
            }
        }

        /* =========================================================
           NAVBAR AREA
        ========================================================= */

        .portfolio-header {
            position: relative;

            width: 100%;
            height: var(--navbar-area-height);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px 40px;

            z-index: 1000;

            background:
                linear-gradient(
                    135deg,
                    rgba(156, 242, 255, 0.95),
                    rgba(213, 247, 255, 0.95),
                    rgba(238, 225, 255, 0.95)
                );
        }

        .portfolio-nav {
            position: relative;

            width: 100%;
            max-width: 1120px;
            height: 72px;

            opacity: 0;

            transform: translateY(-20px);

            animation:
                navEnter
                0.7s
                cubic-bezier(0.22, 1, 0.36, 1)
                forwards;
        }

        @keyframes navEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .portfolio-nav-inner {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            overflow: hidden;

            background:
                rgba(245, 252, 255, 0.78);

            border:
                1px solid
                rgba(255, 255, 255, 0.9);

            border-radius: 22px;

            box-shadow:
                0 12px 40px
                rgba(53, 125, 160, 0.18),
                inset 0 1px 0
                rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            transition:
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .portfolio-nav-inner:hover {
            background:
                rgba(250, 254, 255, 0.9);

            box-shadow:
                0 16px 50px
                rgba(53, 125, 160, 0.24),
                inset 0 1px 0
                rgba(255, 255, 255, 1);
        }

        .portfolio-nav-inner::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            left: -100px;
            top: -120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(67, 217, 255, 0.32),
                    transparent 70%
                );

            pointer-events: none;

            animation:
                navGlow
                6s ease-in-out infinite alternate;
        }

        .portfolio-nav-inner::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -100px;
            bottom: -140px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(189, 124, 255, 0.22),
                    transparent 70%
                );

            pointer-events: none;

            animation:
                navGlow
                7s ease-in-out infinite alternate-reverse;
        }

        @keyframes navGlow {
            from {
                transform: scale(0.85);
                opacity: 0.6;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .portfolio-logo {
            position: relative;

            z-index: 2;

            display: block;

            margin: 0;
            padding: 0;

            color: #17384a;

            font-size: 21px;
            font-weight: 900;

            line-height: 0.9;
            letter-spacing: -0.9px;

            cursor: default;
            user-select: none;
        }

        .portfolio-nav-links {
            position: relative;

            z-index: 2;

            display: flex;
            align-items: center;

            gap: 10px;

            margin: 0 !important;
            padding: 0 !important;

            list-style: none !important;

            background: transparent !important;
        }

        .portfolio-nav-item {
            display: block;

            margin: 0 !important;
            padding: 0 !important;

            background: transparent !important;

            border: none !important;

            list-style: none !important;
        }

        .portfolio-nav-link {
            position: relative;

            display: flex !important;

            align-items: center;
            justify-content: center;

            height: 44px;

            margin: 0 !important;
            padding: 0 20px !important;

            overflow: hidden;

            color: #35566a !important;

            background:
                rgba(255, 255, 255, 0.38) !important;

            text-decoration: none !important;

            font-size: 14px !important;
            font-weight: 700 !important;

            line-height: 44px !important;

            border:
                1px solid
                rgba(255, 255, 255, 0.6) !important;

            border-radius: 14px !important;

            box-shadow: none !important;

            transition:
                transform 0.22s ease,
                background 0.22s ease,
                color 0.22s ease,
                box-shadow 0.22s ease;
        }

        .portfolio-nav-link::after {
            content: "";

            position: absolute;

            width: 0;
            height: 0;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(67, 217, 255, 0.18);

            transition:
                width 0.35s ease,
                height 0.35s ease;
        }

        .portfolio-nav-link:hover {
            color: #153d52 !important;

            background:
                rgba(255, 255, 255, 0.85) !important;

            transform: translateY(-2px);

            box-shadow:
                0 8px 22px
                rgba(49, 125, 160, 0.15) !important;
        }

        .portfolio-nav-link:hover::after {
            width: 150px;
            height: 150px;
        }

        .portfolio-nav-link span {
            position: relative;
            z-index: 2;
        }

        .portfolio-mobile-button {
            position: relative;

            z-index: 5;

            display: none;

            width: 44px;
            height: 44px;

            padding: 0;

            align-items: center;
            justify-content: center;
            flex-direction: column;

            gap: 5px;

            background:
                rgba(255, 255, 255, 0.55);

            border:
                1px solid
                rgba(255, 255, 255, 0.8);

            border-radius: 13px;

            cursor: pointer;
        }

        .portfolio-mobile-button span {
            display: block;

            width: 21px;
            height: 2px;

            background: #17384a;

            border-radius: 100px;
        }

        /* =========================================================
           UNITY GAME
        ========================================================= */

        #unity-container {
            position: fixed !important;

            top: var(--navbar-area-height) !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;

            width: 100vw !important;

            height:
                calc(
                    100vh - var(--navbar-area-height)
                ) !important;

            margin: 0 !important;
            padding: 0 !important;

            transform: none !important;

            overflow: hidden;

            z-index: 10;

            background:
                linear-gradient(
                    135deg,
                    #b4f4ff,
                    #e2faff,
                    #e9ddff
                );
        }

        #unity-container.unity-desktop,
        #unity-container.unity-mobile {
            width: 100vw !important;

            height:
                calc(
                    100vh - var(--navbar-area-height)
                ) !important;
        }

        #unity-canvas {
            position: absolute;

            inset: 0;

            display: block;

            width: 100% !important;
            height: 100% !important;

            margin: 0 !important;
            padding: 0 !important;

            outline: none;

            background:
                linear-gradient(
                    135deg,
                    #b4f4ff,
                    #e2faff
                );
        }

        #unity-footer {
            display: none !important;
        }

        /* =========================================================
           LOADING
        ========================================================= */

        #unity-loading-bar {
            position: absolute !important;

            top: 50% !important;
            left: 50% !important;

            width:
                min(
                    430px,
                    calc(100vw - 48px)
                );

            transform:
                translate(-50%, -50%) !important;

            padding: 32px;

            background:
                rgba(244, 253, 255, 0.93);

            border:
                1px solid
                rgba(255, 255, 255, 0.95);

            border-radius: 26px;

            box-shadow:
                0 25px 70px
                rgba(57, 118, 150, 0.22);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            z-index: 2000;
        }

        #unity-logo {
            display: none !important;
        }

        #unity-loading-bar::before {
            content:
                "LOADING INTERACTIVE PORTFOLIO";

            display: block;

            margin-bottom: 18px;

            color: #254b60;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2px;

            text-align: center;
        }

        #unity-progress-bar-empty {
            position: relative;

            width: 100% !important;
            height: 13px !important;

            margin: 0 !important;

            overflow: hidden;

            background:
                rgba(49, 113, 145, 0.1);

            border:
                1px solid
                rgba(57, 124, 160, 0.1);

            border-radius: 999px;

            color: transparent;
        }

        #unity-progress-bar-full {
            position: relative;

            width: 0%;
            height: 100% !important;

            margin: 0 !important;

            background:
                linear-gradient(
                    90deg,
                    #43d9ff,
                    #659bff,
                    #bd7cff,
                    #43d9ff
                );

            background-size: 300% 100%;

            border-radius: inherit;

            animation:
                loadingGradient
                2s linear infinite;

            transition:
                width 0.15s ease;
        }

        @keyframes loadingGradient {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        #unity-warning {
            position: absolute;

            top: 20px;
            left: 50%;

            width:
                min(
                    600px,
                    calc(100% - 40px)
                );

            transform: translateX(-50%);

            z-index: 3000;
        }

        /* =========================================================
           FULLSCREEN BUTTON
        ========================================================= */

        .portfolio-fullscreen {
            position: fixed;

            right: 24px;
            bottom: 24px;

            width: 52px;
            height: 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 1500;

            padding: 0;

            color: #21485d;

            background:
                rgba(245, 253, 255, 0.85);

            border:
                1px solid
                rgba(255, 255, 255, 0.9);

            border-radius: 17px;

            box-shadow:
                0 12px 35px
                rgba(40, 110, 145, 0.18);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            cursor: pointer;

            animation:
                fullscreenFloat
                3s ease-in-out infinite;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                color 0.25s ease;
        }

        @keyframes fullscreenFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .portfolio-fullscreen:hover {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #43d9ff,
                    #659bff
                );

            animation: none;

            transform:
                translateY(-4px)
                scale(1.05);
        }

        .portfolio-fullscreen svg {
            width: 22px;
            height: 22px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {
            :root {
                --navbar-area-height: 92px;
            }

            .portfolio-header {
                height: var(--navbar-area-height);

                padding:
                    10px
                    12px;
            }

            .portfolio-nav {
                height: 72px;
            }

            .portfolio-nav-inner {
                padding: 0 16px;
            }

            .portfolio-mobile-button {
                display: flex;
            }

            .portfolio-nav-links {
                position: fixed;

                top: 92px;
                left: 12px;

                width:
                    calc(
                        100% - 24px
                    );

                display: none;

                flex-direction: column;

                padding: 12px !important;

                background:
                    rgba(
                        245,
                        253,
                        255,
                        0.97
                    ) !important;

                border:
                    1px solid
                    rgba(
                        255,
                        255,
                        255,
                        0.95
                    );

                border-radius: 18px;

                box-shadow:
                    0 20px 50px
                    rgba(
                        40,
                        100,
                        130,
                        0.2
                    );

                backdrop-filter: blur(22px);
                -webkit-backdrop-filter: blur(22px);
            }

            .portfolio-nav-links.open {
                display: flex;
            }

            .portfolio-nav-item {
                width: 100%;
            }

            .portfolio-nav-link {
                width: 100%;
            }

            .portfolio-fullscreen {
                right: 14px;
                bottom: 14px;
            }
        }
    </style>
</head>

<body>

    <header class="portfolio-header">

        <nav class="portfolio-nav">

            <div class="portfolio-nav-inner">

                <div class="portfolio-logo">
                    Jessie<br>
                    Coleman
                </div>

                <button
                    class="portfolio-mobile-button"
                    id="portfolio-mobile-button"
                    aria-label="Open navigation"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <ul
                    class="portfolio-nav-links"
                    id="portfolio-nav-links"
                >
                    <li class="portfolio-nav-item">

                        <a
                            href="/index.html"
                            class="portfolio-nav-link"
                        >
                            <span>Home</span>
                        </a>

                    </li>

                    <li class="portfolio-nav-item">

                        <a
                            href="/contact.html"
                            class="portfolio-nav-link"
                        >
                            <span>Contact Me</span>
                        </a>

                    </li>
                </ul>

            </div>

        </nav>

    </header>

    <div
        id="unity-container"
        class="unity-desktop"
    >

        <canvas
            id="unity-canvas"
            tabindex="-1"
        ></canvas>

        <div id="unity-loading-bar">

            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>

        </div>

        <div id="unity-warning"></div>

    </div>

    <button
        class="portfolio-fullscreen"
        id="portfolio-fullscreen"
        aria-label="Enter fullscreen"
        title="Fullscreen"
    >
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        >
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
    </button>

    <script>
        const container =
            document.querySelector(
                "#unity-container"
            );

        const canvas =
            document.querySelector(
                "#unity-canvas"
            );

        const loadingBar =
            document.querySelector(
                "#unity-loading-bar"
            );

        const progressBarFull =
            document.querySelector(
                "#unity-progress-bar-full"
            );

        const warningBanner =
            document.querySelector(
                "#unity-warning"
            );

        const fullscreenButton =
            document.querySelector(
                "#portfolio-fullscreen"
            );

        const mobileButton =
            document.querySelector(
                "#portfolio-mobile-button"
            );

        const navLinks =
            document.querySelector(
                "#portfolio-nav-links"
            );

        let unityInstance = null;

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display =
                    warningBanner.children.length
                        ? "block"
                        : "none";
            }

            const div =
                document.createElement("div");

            div.innerHTML = msg;

            warningBanner.appendChild(div);

            if (type === "error") {
                div.style =
                    "background:#ff5d73;color:white;padding:12px 16px;border-radius:14px;";
            } else {
                if (type === "warning") {
                    div.style =
                        "background:#ffe27a;color:#243746;padding:12px 16px;border-radius:14px;";
                }

                setTimeout(
                    function() {
                        if (div.parentNode) {
                            warningBanner.removeChild(div);
                        }

                        updateBannerVisibility();
                    },
                    5000
                );
            }

            updateBannerVisibility();
        }

        const buildUrl =
            "Build";

        const loaderUrl =
            buildUrl + "/Build.loader.js";

        const config = {
            dataUrl:
                buildUrl + "/Build.data.unityweb",

            frameworkUrl:
                buildUrl + "/Build.framework.js.unityweb",

            codeUrl:
                buildUrl + "/Build.wasm.unityweb",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "Jessie Coleman",

            productName:
                "Jessie Coleman Interactive Portfolio",

            productVersion:
                "0.1",

            showBanner:
                unityShowBanner,

            matchWebGLToCanvasSize:
                true
        };

        function resizeUnity() {
            const navbarHeight =
                document
                    .querySelector(
                        ".portfolio-header"
                    )
                    .offsetHeight;

            const gameHeight =
                window.innerHeight -
                navbarHeight;

            container.style.top =
                navbarHeight + "px";

            container.style.height =
                gameHeight + "px";

            canvas.style.width =
                window.innerWidth + "px";

            canvas.style.height =
                gameHeight + "px";
        }

        resizeUnity();

        window.addEventListener(
            "resize",
            resizeUnity
        );

        loadingBar.style.display =
            "block";

        const script =
            document.createElement("script");

        script.src =
            loaderUrl;

        script.onload = () => {
            createUnityInstance(
                canvas,
                config,
                (progress) => {
                    progressBarFull.style.width =
                        (100 * progress) + "%";
                }
            )
            .then(
                (instance) => {
                    unityInstance =
                        instance;

                    loadingBar.style.display =
                        "none";

                    resizeUnity();

                    canvas.focus();
                }
            )
            .catch(
                (message) => {
                    unityShowBanner(
                        message,
                        "error"
                    );
                }
            );
        };

        script.onerror = () => {
            unityShowBanner(
                "Unable to load the Unity WebGL loader.",
                "error"
            );
        };

        document.body.appendChild(script);

        fullscreenButton.addEventListener(
            "click",
            async () => {
                try {
                    if (!document.fullscreenElement) {
                        await document
                            .documentElement
                            .requestFullscreen();
                    } else {
                        await document
                            .exitFullscreen();
                    }

                    resizeUnity();

                    canvas.focus();
                } catch (error) {
                    console.error(
                        "Fullscreen failed:",
                        error
                    );
                }
            }
        );

        mobileButton.addEventListener(
            "click",
            () => {
                navLinks.classList.toggle(
                    "open"
                );
            }
        );

        canvas.addEventListener(
            "mousedown",
            () => {
                canvas.focus();
            }
        );
    </script>

</body>
</html>
