<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jessie Coleman | Contact</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #9cf2ff 0%,
                    #d5f7ff 45%,
                    #eee1ff 100%
                );

            color: #17384a;
        }

        body {
            position: relative;
            overflow-x: hidden;
        }

        /* =========================================================
           ANIMATED BACKGROUND
        ========================================================= */

        body::before {
            content: "";

            position: fixed;

            width: 650px;
            height: 650px;

            top: -260px;
            left: -200px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(67, 217, 255, 0.5),
                    transparent 70%
                );

            pointer-events: none;

            animation:
                glowOne
                9s ease-in-out infinite alternate;
        }

        body::after {
            content: "";

            position: fixed;

            width: 650px;
            height: 650px;

            right: -220px;
            bottom: -260px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(189, 124, 255, 0.35),
                    transparent 70%
                );

            pointer-events: none;

            animation:
                glowTwo
                11s ease-in-out infinite alternate;
        }

        @keyframes glowOne {
            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(100px, 70px)
                    scale(1.2);
            }
        }

        @keyframes glowTwo {
            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(-100px, -70px)
                    scale(1.15);
            }
        }

        /* =========================================================
           NAVBAR
        ========================================================= */

        .portfolio-nav {
            position: fixed;

            top: 22px;
            left: 50%;

            width: calc(100% - 80px);
            max-width: 1120px;
            height: 72px;

            transform:
                translateX(-50%)
                translateY(-25px);

            z-index: 1000;

            opacity: 0;

            animation:
                navEnter
                0.7s
                cubic-bezier(0.22, 1, 0.36, 1)
                forwards;
        }

        @keyframes navEnter {
            to {
                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }

        .portfolio-nav-inner {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            overflow: hidden;

            background:
                rgba(245, 252, 255, 0.78);

            border:
                1px solid
                rgba(255, 255, 255, 0.9);

            border-radius: 22px;

            box-shadow:
                0 12px 40px
                rgba(53, 125, 160, 0.18),
                inset 0 1px 0
                rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .portfolio-nav-inner:hover {
            background:
                rgba(250, 254, 255, 0.9);

            box-shadow:
                0 16px 50px
                rgba(53, 125, 160, 0.24),
                inset 0 1px 0
                rgba(255, 255, 255, 1);
        }

        .portfolio-nav-inner::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            left: -100px;
            top: -120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(67, 217, 255, 0.32),
                    transparent 70%
                );

            pointer-events: none;

            animation:
                navGlow
                6s ease-in-out infinite alternate;
        }

        .portfolio-nav-inner::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -100px;
            bottom: -140px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(189, 124, 255, 0.22),
                    transparent 70%
                );

            pointer-events: none;

            animation:
                navGlow
                7s ease-in-out infinite alternate-reverse;
        }

        @keyframes navGlow {
            from {
                transform: scale(0.85);
                opacity: 0.6;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .portfolio-logo {
            position: relative;
            z-index: 2;

            color: #17384a;

            font-size: 21px;
            font-weight: 900;

            line-height: 0.9;
            letter-spacing: -0.9px;

            cursor: default;
            user-select: none;
        }

        .portfolio-nav-links {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;

            gap: 10px;

            margin: 0;
            padding: 0;

            list-style: none;
        }

        .portfolio-nav-item {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .portfolio-nav-link {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            height: 44px;

            padding: 0 20px;

            overflow: hidden;

            color: #35566a;

            background:
                rgba(255, 255, 255, 0.38);

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            border:
                1px solid
                rgba(255, 255, 255, 0.6);

            border-radius: 14px;

            transition:
                transform 0.22s ease,
                background 0.22s ease,
                color 0.22s ease,
                box-shadow 0.22s ease;
        }

        .portfolio-nav-link::after {
            content: "";

            position: absolute;

            width: 0;
            height: 0;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(67, 217, 255, 0.18);

            transition:
                width 0.35s ease,
                height 0.35s ease;
        }

        .portfolio-nav-link:hover {
            color: #153d52;

            background:
                rgba(255, 255, 255, 0.85);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 22px
                rgba(49, 125, 160, 0.15);
        }

        .portfolio-nav-link:hover::after {
            width: 150px;
            height: 150px;
        }

        .portfolio-nav-link span {
            position: relative;
            z-index: 2;
        }

        .portfolio-mobile-button {
            position: relative;
            z-index: 5;

            display: none;

            width: 44px;
            height: 44px;

            padding: 0;

            align-items: center;
            justify-content: center;
            flex-direction: column;

            gap: 5px;

            background:
                rgba(255, 255, 255, 0.55);

            border:
                1px solid
                rgba(255, 255, 255, 0.8);

            border-radius: 13px;

            cursor: pointer;
        }

        .portfolio-mobile-button span {
            display: block;

            width: 21px;
            height: 2px;

            background: #17384a;

            border-radius: 100px;
        }

        /* =========================================================
           CONTACT PAGE
        ========================================================= */

        .contact-page {
            position: relative;
            z-index: 10;

            width: 100%;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                135px
                40px
                60px;
        }

        .contact-container {
            width: 100%;
            max-width: 1050px;

            display: grid;

            grid-template-columns:
                minmax(0, 1.35fr)
                minmax(260px, 0.65fr);

            gap: 35px;

            padding: 42px;

            background:
                rgba(245, 252, 255, 0.7);

            border:
                1px solid
                rgba(255, 255, 255, 0.9);

            border-radius: 30px;

            box-shadow:
                0 25px 70px
                rgba(55, 125, 160, 0.2),
                inset 0 1px 0
                rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            animation:
                contactEnter
                0.8s
                cubic-bezier(0.22, 1, 0.36, 1)
                forwards;

            opacity: 0;

            transform:
                translateY(30px)
                scale(0.98);
        }

        @keyframes contactEnter {
            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .contact-content {
            display: flex;
            flex-direction: column;
        }

        .contact-eyebrow {
            margin-bottom: 8px;

            color: #2488ac;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .contact-title {
            margin: 0 0 10px;

            color: #17384a;

            font-size:
                clamp(
                    36px,
                    5vw,
                    58px
                );

            font-weight: 900;

            letter-spacing: -2.5px;

            line-height: 1;
        }

        .contact-description {
            max-width: 600px;

            margin:
                0
                0
                30px;

            color: #587286;

            font-size: 16px;
            line-height: 1.6;
        }

        /* =========================================================
           CONTACT CARDS
        ========================================================= */

        .contact-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;
        }

        .contact-card {
            position: relative;

            min-height: 120px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 20px;

            overflow: hidden;

            color: #17384a;

            background:
                rgba(255, 255, 255, 0.48);

            border:
                1px solid
                rgba(255, 255, 255, 0.85);

            border-radius: 20px;

            text-decoration: none;

            box-shadow:
                0 8px 25px
                rgba(50, 120, 155, 0.08);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .contact-card::before {
            content: "";

            position: absolute;

            width: 110px;
            height: 110px;

            right: -55px;
            bottom: -60px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(67, 217, 255, 0.28),
                    transparent 70%
                );

            transition:
                transform 0.35s ease;
        }

        .contact-card:hover {
            transform:
                translateY(-5px);

            background:
                rgba(255, 255, 255, 0.78);

            box-shadow:
                0 16px 35px
                rgba(50, 120, 155, 0.16);
        }

        .contact-card:hover::before {
            transform: scale(1.6);
        }

        .contact-card-title {
            position: relative;
            z-index: 2;

            margin-bottom: 12px;

            color: #2488ac;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .contact-card-value {
            position: relative;
            z-index: 2;

            color: #17384a;

            font-size: 16px;
            font-weight: 750;

            line-height: 1.35;

            word-break: break-word;
        }

        /* =========================================================
           PHOTO
        ========================================================= */

        .contact-photo-container {
            display: flex;

            align-items: center;
            justify-content: center;
        }

        .contact-photo-wrapper {
            position: relative;

            width: min(280px, 100%);
            aspect-ratio: 1 / 1;

            padding: 8px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(67, 217, 255, 0.9),
                    rgba(101, 155, 255, 0.65),
                    rgba(189, 124, 255, 0.8)
                );

            box-shadow:
                0 20px 50px
                rgba(70, 130, 170, 0.25);

            animation:
                photoFloat
                5s ease-in-out infinite;
        }

        @keyframes photoFloat {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-1deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(1deg);
            }
        }

        .contact-photo {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 23px;

            background: white;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 800px) {
            .contact-page {
                padding:
                    120px
                    20px
                    40px;
            }

            .contact-container {
                grid-template-columns: 1fr;

                padding: 28px;

                gap: 30px;
            }

            .contact-photo-container {
                grid-row: 1;
            }

            .contact-photo-wrapper {
                width: 220px;
            }
        }

        @media (max-width: 700px) {
            .portfolio-nav {
                top: 12px;

                width:
                    calc(100% - 24px);
            }

            .portfolio-nav-inner {
                padding: 0 16px;
            }

            .portfolio-mobile-button {
                display: flex;
            }

            .portfolio-nav-links {
                position: absolute;

                top: 82px;
                left: 0;

                width: 100%;

                display: none;

                flex-direction: column;

                padding: 12px;

                background:
                    rgba(245, 253, 255, 0.97);

                border:
                    1px solid
                    rgba(255, 255, 255, 0.95);

                border-radius: 18px;

                box-shadow:
                    0 20px 50px
                    rgba(40, 100, 130, 0.2);

                backdrop-filter: blur(22px);
                -webkit-backdrop-filter: blur(22px);
            }

            .portfolio-nav-links.open {
                display: flex;
            }

            .portfolio-nav-item {
                width: 100%;
            }

            .portfolio-nav-link {
                width: 100%;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="portfolio-nav">
        <div class="portfolio-nav-inner">

            <div class="portfolio-logo">
                Jessie<br>
                Coleman
            </div>

            <button
                class="portfolio-mobile-button"
                id="portfolio-mobile-button"
                aria-label="Open navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul
                class="portfolio-nav-links"
                id="portfolio-nav-links"
            >
                <li class="portfolio-nav-item">
                    <a
                        href="/index.html"
                        class="portfolio-nav-link"
                    >
                        <span>Home</span>
                    </a>
                </li>

                <li class="portfolio-nav-item">
                    <a
                        href="/contact.html"
                        class="portfolio-nav-link"
                    >
                        <span>Contact Me</span>
                    </a>
                </li>
            </ul>

        </div>
    </nav>

    <main class="contact-page">

        <div class="contact-container">

            <section class="contact-content">

                <div class="contact-eyebrow">
                    Get In Touch
                </div>

                <h1 class="contact-title">
                    Let's connect.
                </h1>

                <p class="contact-description">
                    Feel free to reach out through email, LinkedIn,
                    GitHub, or phone.
                </p>

                <div class="contact-grid">

                    <a
                        href="mailto:jessiecoleman928@gmail.com"
                        class="contact-card"
                    >
                        <div class="contact-card-title">
                            Email
                        </div>

                        <div class="contact-card-value">
                            jessiecoleman928@gmail.com
                        </div>
                    </a>

                    <a
                        href="https://www.linkedin.com/in/jessie-coleman-02824321b/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="contact-card"
                    >
                        <div class="contact-card-title">
                            LinkedIn
                        </div>

                        <div class="contact-card-value">
                            LinkedIn Profile
                        </div>
                    </a>

                    <a
                        href="tel:+19158319109"
                        class="contact-card"
                    >
                        <div class="contact-card-title">
                            Phone
                        </div>

                        <div class="contact-card-value">
                            (915) 831-9109
                        </div>
                    </a>

                    <a
                        href="https://github.com/SacredStudios"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="contact-card"
                    >
                        <div class="contact-card-title">
                            GitHub
                        </div>

                        <div class="contact-card-value">
                            GitHub Profile
                        </div>
                    </a>

                </div>

            </section>

            <div class="contact-photo-container">

                <div class="contact-photo-wrapper">

                    <img
                        src="Images/pic1.jpg"
                        alt="Jessie Coleman"
                        class="contact-photo"
                    >

                </div>

            </div>

        </div>

    </main>

    <script>
        const mobileButton =
            document.querySelector(
                "#portfolio-mobile-button"
            );

        const navLinks =
            document.querySelector(
                "#portfolio-nav-links"
            );

        mobileButton.addEventListener(
            "click",
            () =>
            {
                navLinks.classList.toggle(
                    "open"
                );
            }
        );
    </script>

</body>
</html>
